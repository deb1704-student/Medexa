services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: medexa-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      CHOKIDAR_USEPOLLING: "true"

    restart: unless-stopped

volumes:
  frontend_node_modules:
