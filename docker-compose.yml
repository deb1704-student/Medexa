services:
  db:
    image: postgres:16-alpine
    container_name: medexa-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: medexa_user
      POSTGRES_PASSWORD: medexa_pass
      POSTGRES_DB: medexa

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U medexa_user -d medexa"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: medexa-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+asyncpg://medexa_user:medexa_pass@db:5432/medexa
      DATABASE_URL_SYNC: postgresql+psycopg2://medexa_user:medexa_pass@db:5432/medexa

      JWT_SECRET_KEY: dev-secret-change-before-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 720

      CORS_ORIGINS: '["http://localhost:5173"]'

      COMPLETION_RATE_ALERT_BELOW_PERCENT: 80.0
      FOLLOW_UP_COMPLIANCE_ALERT_BELOW_PERCENT: 70.0
      REFERRAL_DELAY_ALERT_ABOVE_HOURS: 12.0

      CLINICAL_RISK_HIGH_THRESHOLD: 6
      CLINICAL_RISK_MODERATE_THRESHOLD: 3

      CONTINUITY_RISK_HIGH_THRESHOLD: 6
      CONTINUITY_RISK_MEDIUM_THRESHOLD: 3

      SLA_ACKNOWLEDGEMENT_HOURS: 6
      SLA_APPOINTMENT_HOURS: 24
      SLA_CONSULTATION_HOURS: 48
      SLA_BACK_REFERRAL_HOURS: 72
      SLA_FOLLOW_UP_HOURS: 168

      BHASHINI_API_KEY: ""

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: medexa-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      CHOKIDAR_USEPOLLING: "true"


volumes:
  pgdata:
  frontend_node_modules:
